name: vietnam_merged_map
description: "Bản đồ hành chính Việt Nam sau sáp nhập"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  syncfusion_flutter_maps: ^33.2.6
  syncfusion_flutter_core: ^33.2.6
  intl: ^0.20.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/provinces.geojson
    - assets/communes.json
